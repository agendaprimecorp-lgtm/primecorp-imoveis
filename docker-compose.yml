services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: primecorp
      POSTGRES_USER: primecorp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    command: >
      postgres -c wal_level=replica -c archive_mode=on
               -c archive_command='test ! -f /backups/wal/%f && cp %p /backups/wal/%f'
               -c max_wal_senders=3 -c shared_buffers=512MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primecorp -d primecorp"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://primecorp:${POSTGRES_PASSWORD}@db:5432/primecorp?sslmode=prefer
    depends_on:
      db: {condition: service_healthy}
    expose: ["8000"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --appendonly yes
    volumes: [redisdata:/data]
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/primecorp.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [api]
    restart: unless-stopped

volumes: {pgdata: {}, redisdata: {}}
