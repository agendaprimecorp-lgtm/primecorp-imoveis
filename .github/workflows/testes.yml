name: testes

# Nunca faz deploy nem toca em main: so roda a bateria e reporta.
on:
  push:
    branches: [rodrigo, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bateria:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # sem cache: o package-lock.json e ignorado neste repo (.gitignore:62)

      # weasyprint precisa de pango/harfbuzz do sistema, senao o import
      # de app.ptam quebra antes de qualquer teste rodar.
      - name: Bibliotecas de sistema do weasyprint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libfribidi0 libffi-dev

      - name: Dependencias Python
        run: pip install -r requirements.txt

      # npm install, nao npm ci: o package-lock.json e ignorado neste
      # repositorio (.gitignore:62), e npm ci exige o lock.
      - name: Dependencias Node
        run: npm install --no-audit --no-fund

      - name: Backend (pytest)
        run: python -m pytest tests/ -q

      - name: DOM headless (motor, site, painel)
        run: npm test
