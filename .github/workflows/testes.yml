name: testes

# Nunca faz deploy nem toca em main: so roda a bateria e reporta.
on:
  push:
    branches: [rodrigo, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bateria:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # weasyprint precisa de pango/harfbuzz do sistema, senao o import
      # de app.ptam quebra antes de qualquer teste rodar.
      - name: Bibliotecas de sistema do weasyprint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libfribidi0 libffi-dev

      - name: Dependencias Python
        run: pip install -r requirements.txt

      # npm ci: instala exatamente o que esta no package-lock.json,
      # sem resolver versoes de novo. Instalacao reproduzivel.
      - name: Dependencias Node
        run: npm ci

      - name: Backend (pytest)
        run: python -m pytest tests/ -q

      - name: DOM headless (motor, site, painel)
        run: npm test
