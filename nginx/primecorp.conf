# Rate limit e TLS na borda — não em um Map na memória do processo (corrige P2-1).
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m   rate=60r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server {
    listen 80;
    server_name primecorpimoveis.com.br www.primecorpimoveis.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name primecorpimoveis.com.br www.primecorpimoveis.com.br;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_stapling on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 32m;
    server_tokens off;
    limit_conn conn 20;

    # Login: 5 por minuto por IP, sem burst. Combinado com o lockout por conta
    # no banco, força bruta distribuída fica inviável.
    location = /api/auth/login {
        limit_req zone=login nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_params_pc;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_params_pc;
    }

    location / {
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_params_pc;
    }
}
